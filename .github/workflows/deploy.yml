name: CI/CD Pipeline to GCP VM

on:
  push:
    branches:
      - main

jobs:
  # ขั้นตอนที่ 1 & 2: Build & Push Docker Image to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest

  # ขั้นตอนที่ 3, 4 & 5: Login to VM Server -> Pull -> Run Docker Container
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to VM Server via SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Connected to GCP VM Server successfully!"
            
            # 1. Pull Docker Image ล่าสุดลงมาจาก Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            
            # 2. หยุดและลบ Container เก่า (ถ้ามี)
            docker stop webapp || true
            docker rm webapp || true
            
            # 3. สั่ง Run Docker Image ตัวใหม่บนพอร์ต 80
            docker run -d --name webapp -p 80:3000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            
            echo "Deployment completed successfully!"
